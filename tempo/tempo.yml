server:
  http_listen_port: 3200

##########################################################

distributor:

  receivers:

    otlp:

      protocols:

        grpc:

          endpoint: 0.0.0.0:4317

        http:

          endpoint: 0.0.0.0:4318

##########################################################

ingester:

  max_block_duration: 5m

##########################################################

compactor:

  compaction:

    block_retention: 720h

##########################################################

storage:

  trace:

    backend: local

    local:

      path: /var/tempo/traces

##########################################################

overrides:

  defaults:

    metrics_generator:

      processors:

        - service-graphs

        - span-metrics

##########################################################

metrics_generator:

  registry:

    external_labels:

      source: tempo

      cluster: observability

  storage:

    path: /var/tempo/generator

##########################################################

usage_report:

  reporting_enabled: false
